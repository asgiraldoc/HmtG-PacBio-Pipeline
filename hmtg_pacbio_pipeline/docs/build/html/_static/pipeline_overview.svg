<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" />
    </marker>
  </defs>

  <rect x="20" y="70" width="170" height="70" rx="10" ry="10" fill="white" stroke="black"/>
  <text x="105" y="100" text-anchor="middle" font-family="Arial" font-size="14">Input FASTQ</text>
  <text x="105" y="120" text-anchor="middle" font-family="Arial" font-size="12">long-read amplicons</text>

  <rect x="220" y="70" width="170" height="70" rx="10" ry="10" fill="white" stroke="black"/>
  <text x="305" y="98" text-anchor="middle" font-family="Arial" font-size="14">Q-filter +</text>
  <text x="305" y="118" text-anchor="middle" font-family="Arial" font-size="14">Subsample</text>
  <text x="305" y="138" text-anchor="middle" font-family="Arial" font-size="11">default: Q≥30, n=5000</text>

  <rect x="420" y="70" width="170" height="70" rx="10" ry="10" fill="white" stroke="black"/>
  <text x="505" y="100" text-anchor="middle" font-family="Arial" font-size="14">MAFFT MSA</text>
  <text x="505" y="122" text-anchor="middle" font-family="Arial" font-size="11">orientation-adjusted</text>

  <rect x="620" y="70" width="170" height="70" rx="10" ry="10" fill="white" stroke="black"/>
  <text x="705" y="98" text-anchor="middle" font-family="Arial" font-size="14">Haplotype</text>
  <text x="705" y="118" text-anchor="middle" font-family="Arial" font-size="14">Inference</text>
  <text x="705" y="138" text-anchor="middle" font-family="Arial" font-size="11">OTUs + clustering</text>

  <rect x="820" y="45" width="140" height="50" rx="10" ry="10" fill="white" stroke="black"/>
  <text x="890" y="75" text-anchor="middle" font-family="Arial" font-size="13">Report</text>
  <text x="890" y="92" text-anchor="middle" font-family="Arial" font-size="10">PDF + JSON</text>

  <rect x="820" y="120" width="140" height="50" rx="10" ry="10" fill="white" stroke="black"/>
  <text x="890" y="150" text-anchor="middle" font-family="Arial" font-size="13">FASTA/TSV</text>
  <text x="890" y="167" text-anchor="middle" font-family="Arial" font-size="10">haps + distances</text>

  <!-- arrows -->
  <line x1="190" y1="105" x2="220" y2="105" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="105" x2="420" y2="105" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="105" x2="620" y2="105" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="790" y1="105" x2="820" y2="70" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="105" x2="820" y2="145" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="705" y="200" text-anchor="middle" font-family="Arial" font-size="11">
    Optional: local BLAST against a user-provided reference database
  </text>
</svg>
